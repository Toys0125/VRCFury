name: Basis VRCFury Release

on:
  push:
    tags:
      - basis-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing basis-v* tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: com.vrcfury.vrcfury
      PACKAGE_ID: com.toys0125.vrcfury-basis
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and package manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^basis-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match basis-vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          test -f "$PACKAGE_DIR/package.json"
          node <<'NODE'
          const fs = require('node:fs');
          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          const packagePath = `${process.env.PACKAGE_DIR}/package.json`;
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const expectedName = process.env.PACKAGE_ID;
          const expectedVersion = process.env.TAG_NAME.slice('basis-v'.length);
          for (const field of ['name', 'displayName', 'version', 'description', 'url', 'author']) {
            if (!pkg[field]) throw new Error(`Missing package.json field: ${field}`);
          }
          if (pkg.name !== expectedName) throw new Error(`Expected package name ${expectedName}, got ${pkg.name}`);
          if (!semver.test(pkg.version)) throw new Error(`Invalid package version: ${pkg.version}`);
          if (pkg.version !== expectedVersion) throw new Error(`Tag version ${expectedVersion} does not match package version ${pkg.version}`);
          if (!pkg.author.name || !pkg.author.email) throw new Error('author.name and author.email are required');
          if (pkg.dependencies && Object.keys(pkg.dependencies).some((name) => name.startsWith('com.vrchat.'))) {
            throw new Error('Basis package must not depend on VRChat SDK packages');
          }
          NODE

      - name: Build distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE.md "$PACKAGE_DIR/LICENSE.md"
          zip_path="$RUNNER_TEMP/${PACKAGE_ID}-${TAG_NAME#basis-v}.zip"
          (
            cd "$PACKAGE_DIR"
            zip -qr "$zip_path" .
          )
          unzip -Z1 "$zip_path" | grep -Fx 'package.json' >/dev/null
          if unzip -Z1 "$zip_path" | grep -E '(^|/)(\.git|Library|Temp|Logs|test_project|com\.vrchat\.)' >/dev/null; then
            echo 'Release ZIP contains forbidden project or SDK content' >&2
            exit 1
          fi
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "$ZIP_PATH" \
            --verify-tag \
            --title "VRCFury for BasisVR v${TAG_NAME#basis-v}" \
            --generate-notes
